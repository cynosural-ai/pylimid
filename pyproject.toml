[project]
name = "decisionpy"
version = "0.1.0"
description = "A library for mixed-type limited-memory influence diagrams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# NumPyro backend. Optional so the graph layer stays importable with zero
# runtime dependencies; install with `pip install decisionpy[numpyro]`.
numpyro = [
    "numpyro>=0.15",
    "jax>=0.4",
    "funsor>=0.4",
]

[dependency-groups]
dev = [
    "pre-commit>=3.1.1",
    "ruff==0.16.0",
    "ty==0.0.14",
]
test = [
    "pytest>=8.4.0",
    "pgmpy>=0.1",
    "pyagrum>=1.12",
]
backend = [
    "numpyro>=0.15",
    "jax>=0.4",
    "funsor>=0.4",
]

[tool.uv]
default-groups = ["dev", "test", "backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decisionpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
