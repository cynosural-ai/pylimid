[project]
name = "decisionpy"
version = "0.1.0"
description = "A library for mixed-type limited-memory influence diagrams."
readme = "README.md"
requires-python = ">=3.12"
# The inference engines (NumPyro, and VE's distribution extraction) build on
# numpyro/jax; previously an optional extra, now a plain runtime dependency.
dependencies = [
    "numpyro>=0.15",
    "jax>=0.4",
    "funsor>=0.4",
]

[dependency-groups]
dev = [
    "pre-commit>=3.1.1",
    "ruff==0.16.0",
    "ty==0.0.14",
    "jupyterlab>=4.1",
    "jupytext>=1.16",
    "ipywidgets>=8.0",
]
test = [
    "pytest>=8.4.0",
    "pyagrum>=1.12",
    # pyagrum.clg imports pandas at module load without declaring it.
    "pandas>=2.0",
]

[tool.uv]
default-groups = ["dev", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decisionpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
