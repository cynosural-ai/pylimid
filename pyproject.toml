[project]
name = "decisionpy"
version = "0.1.0"
description = "A library for mixed-type limited-memory influence diagrams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=3.1.1",
]
lint = [
    "ruff>=0.11.9",
    "ty==0.0.14",
]
test = [
    "pytest>=8.4.0",
]

[tool.uv]
default-groups = ["dev", "lint", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisionpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
