[project]
name = "pylimid"
version = "0.1.0"
description = "A library for mixed-type limited-memory influence diagrams."
readme = "README.md"
requires-python = ">=3.12"
# The inference engines (NumPyro, and VE's distribution extraction) build on
# numpyro/jax; previously an optional extra, now a plain runtime dependency.
dependencies = [
    "numpyro>=0.15",
    "jax>=0.4",
    "funsor>=0.4",
]

[dependency-groups]
dev = [
    "pre-commit>=3.1.1",
    "ruff==0.16.0",
    "ty==0.0.14",
    "jupyterlab>=4.1",
    "jupytext>=1.16",
    "ipywidgets>=8.0",
    # The examples build the same models in pyAgrum as the exact reference.
    "pyagrum>=1.12",
]
test = [
    "pytest>=8.4.0",
    "pyagrum>=1.12",
    # pyagrum.clg imports pandas at module load without declaring it.
    "pandas>=2.0",
]
docs = [
    # myst-parser 5.1 is not yet compatible with Sphinx 9.
    "sphinx>=8.2,<9",
    "myst-parser>=4",
    "myst-nb>=1.2",
    "sphinx-rtd-theme>=3",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    # myst-nb executes the guide snippets in a Jupyter kernel.
    "ipykernel>=6",
]

[tool.uv]
default-groups = ["dev", "test", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pylimid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
